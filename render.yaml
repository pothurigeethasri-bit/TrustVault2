# Render Blueprint: New + > Blueprint, pick this repo. You type SEED_PASSWORD, ACCESS_PIN and the SMTP_* / APP_BASE_URL values.
databases:
  - name: trustvault-db
    plan: free
    databaseName: trustvault
    user: trustvault_owner

services:
  - type: web
    name: trustvault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # setup_db.py is idempotent: creates tables if missing, seeds the demo users if missing.
    startCommand: python setup_db.py && gunicorn app:app --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz      # open even while the PIN gate is on
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD          # password for the demo accounts; set it in the dashboard
        sync: false
      - key: ACCESS_PIN             # security PIN every visitor must enter before login/register
        sync: false
      # E-mail verification: production refuses to start without these (see .env.example).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL           # e.g. https://trustvault.onrender.com (no trailing slash)
        sync: false
      - key: STORAGE_BACKEND        # Render's disk is wiped on every deploy, so keep files in Postgres
        value: db
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY            # trust Render's one proxy hop for the real client IP
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
